<div id="login-screen">
  <div class="login-card">
    <div class="brand-icon">H</div>
    <h1 id="login-school-name">HASTECH School</h1>
    <div class="motto" id="login-motto">HASTECH School Management System</div>
    <form id="login-form">
      <div class="form-group">
        <label for="login-username">Username <span class="req">*</span></label>
        <input type="text" id="login-username" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="login-password">Password <span class="req">*</span></label>
        <input type="password" id="login-password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="login-submit-btn">Sign In</button>
    </form>
    <div class="login-hint">Demo credentials &mdash; Username: <strong>admin</strong> &middot; Password: <strong>admin123</strong></div>
  </div>
</div>
