<div id="page-payments" class="page">
  <div class="page-header">
    <div>
      <h2>Payments</h2>
      <div class="subtitle">Record fee payments and generate receipts.</div>
    </div>
  </div>

  <div class="grid-2">
    <div class="card">
      <div class="section-title">Record Payment</div>
      <form id="payment-form">
        <input type="hidden" id="pay-student-id">
        <div class="form-group" style="position:relative;">
          <label for="payment-student-search">Student <span class="req">*</span></label>
          <input type="text" id="payment-student-search" placeholder="Search by name or student ID..." autocomplete="off">
          <div id="payment-student-results" style="display:none;position:absolute;z-index:50;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow-lg);width:100%;max-height:220px;overflow-y:auto;"></div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="pay-type">Payment Type <span class="req">*</span></label>
            <select id="pay-type" required>
              <option value="School Fees">School Fees</option>
              <option value="Registration">Registration</option>
              <option value="Examination">Examination</option>
              <option value="Books">Books</option>
              <option value="Uniform">Uniform</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label for="pay-amount">Amount <span class="req">*</span></label>
            <input type="number" id="pay-amount" min="0.01" step="0.01" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="pay-method">Payment Method <span class="req">*</span></label>
            <select id="pay-method" required>
              <option value="Cash">Cash</option>
              <option value="Mobile Money">Mobile Money</option>
              <option value="Bank Transfer">Bank Transfer</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label for="pay-date">Payment Date <span class="req">*</span></label>
            <input type="date" id="pay-date" required>
          </div>
        </div>
        <div class="form-group">
          <label for="pay-reference">Reference</label>
          <input type="text" id="pay-reference" placeholder="Transaction/receipt reference (optional)">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="payment-submit-btn">Record Payment</button>
      </form>
    </div>

    <div class="card">
      <div class="section-title">Filters</div>
      <div class="form-group">
        <label for="payments-filter-class">Class</label>
        <select id="payments-filter-class" class="class-select-source" data-keep-first="true">
          <option value="">All Classes</option>
        </select>
      </div>
      <div class="form-group">
        <label for="payments-filter-type">Payment Type</label>
        <select id="payments-filter-type">
          <option value="">All Types</option>
          <option value="School Fees">School Fees</option>
          <option value="Registration">Registration</option>
          <option value="Examination">Examination</option>
          <option value="Books">Books</option>
          <option value="Uniform">Uniform</option>
          <option value="Other">Other</option>
        </select>
      </div>
    </div>
  </div>

  <div class="card" style="margin-top:18px;">
    <div class="section-title">Payment History</div>
    <div class="table-wrap">
      <table class="responsive-table">
        <thead><tr><th>Student</th><th>Type</th><th>Amount</th><th>Method</th><th>Date</th><th>Recorded By</th><th>Actions</th></tr></thead>
        <tbody id="payments-table-body"></tbody>
      </table>
    </div>
  </div>
</div>
