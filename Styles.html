<style>
  :root {
    --navy: #0F2A4A;
    --navy-dark: #0A1D34;
    --navy-light: #1E4372;
    --accent: #2FB8A3;
    --accent-dark: #23927F;
    --bg: #F4F6F9;
    --card-bg: #FFFFFF;
    --border: #E4E8EF;
    --text: #1B2333;
    --text-muted: #6B7686;
    --success: #2FB86A;
    --warning: #E8A23C;
    --danger: #E85C5C;
    --radius: 12px;
    --shadow: 0 2px 10px rgba(15, 42, 74, 0.06);
    --shadow-lg: 0 8px 28px rgba(15, 42, 74, 0.12);
    --sidebar-w: 250px;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--navy-light); text-decoration: none; }
  h1, h2, h3, h4 { margin: 0 0 4px 0; font-weight: 700; color: var(--navy); }
  p { margin: 0 0 8px 0; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #C7D0DD; border-radius: 8px; }

  /* ---------- Login screen ---------- */
  #login-screen {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--navy-dark), var(--navy) 60%, var(--navy-light));
    z-index: 2000;
  }
  .login-card {
    width: 100%; max-width: 380px;
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
    padding: 36px 32px;
    text-align: center;
  }
  .login-card .brand-icon {
    width: 56px; height: 56px; border-radius: 14px;
    background: var(--navy); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 800; margin: 0 auto 16px;
  }
  .login-card h1 { font-size: 20px; margin-bottom: 2px; }
  .login-card .motto { color: var(--text-muted); font-size: 13px; margin-bottom: 24px; }
  .login-card form { text-align: left; }
  .login-hint { margin-top: 16px; font-size: 12px; color: var(--text-muted); background: #F0F4F8; border-radius: 8px; padding: 10px; }

  /* ---------- App shell ---------- */
  #app-shell { display: none; min-height: 100vh; }
  #app-shell.visible { display: flex; }

  #sidebar {
    width: var(--sidebar-w); min-width: var(--sidebar-w);
    background: var(--navy-dark);
    color: #D9E2EF;
    display: flex; flex-direction: column;
    position: fixed; top: 0; bottom: 0; left: 0;
    transition: transform 0.25s ease;
    z-index: 1000;
  }
  #sidebar .brand {
    padding: 22px 20px; display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  #sidebar .brand .logo-badge {
    width: 36px; height: 36px; border-radius: 9px; background: var(--accent);
    display: flex; align-items: center; justify-content: center; font-weight: 800; color: var(--navy-dark);
    flex-shrink: 0;
  }
  #sidebar .brand .brand-text { overflow: hidden; }
  #sidebar .brand .brand-text .school-name { font-weight: 700; color: #fff; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #sidebar .brand .brand-text .app-label { font-size: 11px; color: #93A2BC; }

  #sidebar nav { flex: 1; padding: 14px 10px; overflow-y: auto; }
  #sidebar .nav-group-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: #6E7D99; padding: 14px 12px 6px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-radius: 8px; cursor: pointer;
    color: #C4D0E4; font-size: 13.5px; font-weight: 500;
    margin-bottom: 2px;
  }
  .nav-item:hover { background: rgba(255,255,255,0.06); color: #fff; }
  .nav-item.active { background: var(--accent); color: var(--navy-dark); font-weight: 700; }
  .nav-item .nav-icon { font-size: 16px; width: 20px; text-align: center; }
  .nav-sub { padding-left: 32px; }
  .nav-sub .nav-item { font-size: 12.5px; padding: 8px 12px; }

  #sidebar .sidebar-footer {
    padding: 14px 16px; border-top: 1px solid rgba(255,255,255,0.08); font-size: 11px; color: #6E7D99;
  }

  #main-area { flex: 1; margin-left: var(--sidebar-w); display: flex; flex-direction: column; min-height: 100vh; }

  #topbar {
    background: var(--card-bg); border-bottom: 1px solid var(--border);
    padding: 14px 24px; display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 500;
  }
  #topbar .page-title { font-size: 18px; font-weight: 700; color: var(--navy); }
  #topbar .topbar-right { display: flex; align-items: center; gap: 14px; }
  .mobile-menu-btn { display: none; background: none; border: none; font-size: 22px; cursor: pointer; color: var(--navy); }
  .user-chip { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .user-chip .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--navy-light); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; }

  #content { padding: 22px 24px 60px; flex: 1; }
  .page { display: none; animation: fadeIn 0.2s ease; }
  .page.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; flex-wrap: wrap; gap: 10px; }
  .page-header h2 { font-size: 20px; }
  .page-header .subtitle { color: var(--text-muted); font-size: 13px; }

  /* ---------- Cards / grids ---------- */
  .card {
    background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow);
    border: 1px solid var(--border); padding: 20px;
  }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 16px; margin-bottom: 20px; }
  .stat-card { background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--border); padding: 18px; position: relative; overflow: hidden; }
  .stat-card .stat-icon { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; margin-bottom: 10px; }
  .stat-card .stat-value { font-size: 24px; font-weight: 800; color: var(--navy); }
  .stat-card .stat-label { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }
  .stat-icon.icon-blue { background: #E4ECFB; color: var(--navy-light); }
  .stat-icon.icon-green { background: #E1F7EC; color: var(--success); }
  .stat-icon.icon-teal { background: #E1F7F3; color: var(--accent-dark); }
  .stat-icon.icon-orange { background: #FCF0DE; color: var(--warning); }
  .stat-icon.icon-red { background: #FCE6E6; color: var(--danger); }

  .grid-2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 18px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  @media (max-width: 900px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }

  .section-title { font-size: 14px; font-weight: 700; color: var(--navy); margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 9px 16px; border-radius: 8px; border: none; font-size: 13.5px; font-weight: 600;
    cursor: pointer; transition: all 0.15s ease; white-space: nowrap;
  }
  .btn-primary { background: var(--navy); color: #fff; }
  .btn-primary:hover { background: var(--navy-light); }
  .btn-accent { background: var(--accent); color: var(--navy-dark); }
  .btn-accent:hover { background: var(--accent-dark); color: #fff; }
  .btn-outline { background: #fff; color: var(--navy); border: 1px solid var(--border); }
  .btn-outline:hover { border-color: var(--navy-light); }
  .btn-danger { background: #fff; color: var(--danger); border: 1px solid #F3C9C9; }
  .btn-danger:hover { background: var(--danger); color: #fff; }
  .btn-sm { padding: 6px 12px; font-size: 12.5px; }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-block { width: 100%; }
  .quick-actions { display: flex; flex-wrap: wrap; gap: 10px; }

  /* ---------- Forms ---------- */
  .form-group { margin-bottom: 14px; }
  .form-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  @media (max-width: 700px) { .form-row { grid-template-columns: 1fr; } }
  label { display: block; font-size: 12.5px; font-weight: 600; color: var(--navy); margin-bottom: 5px; }
  label .req { color: var(--danger); }
  input[type=text], input[type=email], input[type=tel], input[type=number],
  input[type=date], input[type=password], input[type=url], select, textarea {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 13.5px; font-family: inherit; background: #fff; color: var(--text);
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--navy-light); box-shadow: 0 0 0 3px rgba(30,67,114,0.12); }
  textarea { resize: vertical; min-height: 80px; }
  fieldset { border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin: 0 0 16px; }
  legend { font-size: 12.5px; font-weight: 700; color: var(--navy); padding: 0 6px; }

  /* ---------- Tables ---------- */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    text-align: left; padding: 10px 12px; background: #F7F9FC; color: var(--text-muted);
    font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.03em; border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  tbody td { padding: 11px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tbody tr:hover { background: #FAFBFD; }
  tbody tr:last-child td { border-bottom: none; }

  .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; }
  .badge-green { background: #E1F7EC; color: var(--success); }
  .badge-red { background: #FCE6E6; color: var(--danger); }
  .badge-orange { background: #FCF0DE; color: var(--warning); }
  .badge-gray { background: #EEF1F6; color: var(--text-muted); }
  .badge-blue { background: #E4ECFB; color: var(--navy-light); }

  .avatar-sm { width: 32px; height: 32px; border-radius: 50%; background: var(--navy); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; }

  /* Mobile responsive cards for tables */
  @media (max-width: 720px) {
    table.responsive-table thead { display: none; }
    table.responsive-table, table.responsive-table tbody, table.responsive-table tr, table.responsive-table td { display: block; width: 100%; }
    table.responsive-table tr { background: #fff; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; padding: 8px 12px; }
    table.responsive-table td { border: none; padding: 6px 0; display: flex; justify-content: space-between; gap: 10px; }
    table.responsive-table td::before { content: attr(data-label); font-weight: 700; color: var(--text-muted); font-size: 11px; text-transform: uppercase; }
  }

  /* ---------- Search / filter bar ---------- */
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; align-items: center; }
  .toolbar input, .toolbar select { width: auto; min-width: 150px; }
  .toolbar .search-input { flex: 1; min-width: 200px; }

  /* ---------- Progress bar ---------- */
  .progress-track { width: 100%; height: 8px; background: #EEF1F6; border-radius: 6px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 6px; background: var(--accent); transition: width 0.3s ease; }
  .progress-fill.warn { background: var(--warning); }
  .progress-fill.danger { background: var(--danger); }

  /* ---------- Modal ---------- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(10,29,52,0.55); z-index: 1500;
    display: none; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto;
  }
  .modal-overlay.open { display: flex; }
  .modal-box { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow-lg); width: 100%; max-width: 640px; max-height: 90vh; display: flex; flex-direction: column; }
  .modal-box.modal-lg { max-width: 860px; }
  .modal-header { padding: 18px 22px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .modal-header h3 { font-size: 16px; }
  .modal-close { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-muted); }
  .modal-body { padding: 20px 22px; overflow-y: auto; }
  .modal-footer { padding: 16px 22px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }

  /* ---------- Toasts ---------- */
  #toast-container { position: fixed; top: 18px; right: 18px; z-index: 3000; display: flex; flex-direction: column; gap: 10px; }
  .toast {
    min-width: 260px; max-width: 340px; background: #fff; border-radius: 10px; box-shadow: var(--shadow-lg);
    padding: 12px 16px; border-left: 4px solid var(--navy); font-size: 13px; animation: slideIn 0.2s ease;
  }
  .toast.success { border-color: var(--success); }
  .toast.error { border-color: var(--danger); }
  .toast .toast-title { font-weight: 700; margin-bottom: 2px; }
  @keyframes slideIn { from { transform: translateX(30px); opacity: 0; } to { transform: none; opacity: 1; } }

  /* ---------- Loading ---------- */
  .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; display: inline-block; }
  .spinner.dark { border: 2px solid rgba(15,42,74,0.2); border-top-color: var(--navy); }
  @keyframes spin { to { transform: rotate(360deg); } }
  #global-loader {
    position: fixed; inset: 0; background: rgba(244,246,249,0.7); z-index: 2500;
    display: none; align-items: center; justify-content: center; flex-direction: column; gap: 12px;
  }
  #global-loader.visible { display: flex; }
  #global-loader .loader-text { font-size: 13px; color: var(--navy); font-weight: 600; }

  .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
  .empty-state .empty-icon { font-size: 32px; margin-bottom: 8px; }

  .footer-note { text-align: center; color: var(--text-muted); font-size: 11.5px; padding: 20px 0 10px; }

  .attendance-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); gap: 10px; flex-wrap: wrap; }
  .attendance-row:last-child { border-bottom: none; }
  .attendance-status-btns { display: flex; gap: 6px; }
  .status-btn { padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border); background: #fff; font-size: 12px; font-weight: 700; cursor: pointer; color: var(--text-muted); }
  .status-btn.present.selected { background: #E1F7EC; color: var(--success); border-color: var(--success); }
  .status-btn.absent.selected { background: #FCE6E6; color: var(--danger); border-color: var(--danger); }
  .status-btn.late.selected { background: #FCF0DE; color: var(--warning); border-color: var(--warning); }

  .tab-bar { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 18px; }
  .tab-btn { padding: 10px 16px; background: none; border: none; font-size: 13px; font-weight: 600; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; }
  .tab-btn.active { color: var(--navy); border-color: var(--accent); }

  .profile-header { display: flex; gap: 18px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
  .profile-photo { width: 84px; height: 84px; border-radius: 16px; background: var(--navy); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 800; overflow: hidden; }
  .profile-photo img { width: 100%; height: 100%; object-fit: cover; }
  .info-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
  .info-item .info-label { font-size: 11px; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.03em; }
  .info-item .info-value { font-size: 13.5px; font-weight: 600; color: var(--text); margin-top: 2px; }

  /* ---------- Mobile layout ---------- */
  @media (max-width: 900px) {
    #sidebar { transform: translateX(-100%); }
    #sidebar.open { transform: translateX(0); }
    #main-area { margin-left: 0; }
    .mobile-menu-btn { display: inline-flex; }
    .form-row { grid-template-columns: 1fr; }
    #content { padding: 16px; }
    #topbar { padding: 12px 16px; }
    .stat-grid { grid-template-columns: repeat(2, 1fr); }
  }
  #sidebar-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 900; }
  #sidebar-backdrop.visible { display: block; }
</style>
