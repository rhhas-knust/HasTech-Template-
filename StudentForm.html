<div id="page-register-student" class="page">
  <div class="page-header">
    <div>
      <h2 id="student-form-title">Register Student</h2>
      <div class="subtitle">Student ID is generated automatically on save.</div>
    </div>
    <button class="btn btn-outline" data-quick-action="students">&larr; Back to Directory</button>
  </div>

  <form id="student-form" class="card">
    <input type="hidden" id="sf-editing-id">

    <fieldset>
      <legend>Student Information</legend>
      <div class="form-row">
        <div class="form-group">
          <label for="sf-first-name">First Name <span class="req">*</span></label>
          <input type="text" id="sf-first-name" required>
        </div>
        <div class="form-group">
          <label for="sf-middle-name">Middle Name</label>
          <input type="text" id="sf-middle-name">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="sf-last-name">Last Name <span class="req">*</span></label>
          <input type="text" id="sf-last-name" required>
        </div>
        <div class="form-group">
          <label for="sf-dob">Date of Birth <span class="req">*</span></label>
          <input type="date" id="sf-dob" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="sf-gender">Gender <span class="req">*</span></label>
          <select id="sf-gender" required>
            <option value="">Select gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>
        </div>
        <div class="form-group">
          <label for="sf-class">Class <span class="req">*</span></label>
          <select id="sf-class" class="class-select-source" data-keep-first="true" required>
            <option value="">Select class</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="sf-academic-year">Academic Year</label>
          <input type="text" id="sf-academic-year">
        </div>
        <div class="form-group">
          <label for="sf-admission-date">Admission Date</label>
          <input type="date" id="sf-admission-date">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="sf-phone">Student Phone</label>
          <input type="tel" id="sf-phone">
        </div>
        <div class="form-group">
          <label for="sf-email">Student Email</label>
          <input type="email" id="sf-email">
        </div>
      </div>
      <div class="form-group">
        <label for="sf-address">Residential Address</label>
        <textarea id="sf-address"></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="sf-previous-school">Previous School</label>
          <input type="text" id="sf-previous-school">
        </div>
        <div class="form-group">
          <label for="sf-status">Status</label>
          <select id="sf-status">
            <option value="ACTIVE">Active</option>
            <option value="INACTIVE">Inactive</option>
            <option value="GRADUATED">Graduated</option>
            <option value="TRANSFERRED">Transferred</option>
          </select>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Guardian Information</legend>
      <div class="form-row">
        <div class="form-group">
          <label for="sf-guardian-name">Guardian Name</label>
          <input type="text" id="sf-guardian-name">
        </div>
        <div class="form-group">
          <label for="sf-guardian-relationship">Relationship</label>
          <select id="sf-guardian-relationship">
            <option value="">Select relationship</option>
            <option value="Father">Father</option>
            <option value="Mother">Mother</option>
            <option value="Guardian">Guardian</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="sf-guardian-phone">Guardian Phone</label>
          <input type="tel" id="sf-guardian-phone">
        </div>
        <div class="form-group">
          <label for="sf-guardian-email">Guardian Email</label>
          <input type="email" id="sf-guardian-email">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="sf-guardian-occupation">Occupation</label>
          <input type="text" id="sf-guardian-occupation">
        </div>
        <div class="form-group">
          <label for="sf-guardian-address">Guardian Address</label>
          <input type="text" id="sf-guardian-address">
        </div>
      </div>
    </fieldset>

    <div class="quick-actions">
      <button type="submit" class="btn btn-primary" id="student-submit-btn">Register Student</button>
      <button type="button" class="btn btn-outline" data-quick-action="students">Cancel</button>
    </div>
  </form>
</div>
